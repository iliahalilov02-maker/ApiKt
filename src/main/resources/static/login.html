<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Вход</title>
    <style>
        body { font-family: sans-serif; background: #f2f4f8; display: flex;
               justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .card { background: #fff; padding: 32px; border-radius: 12px;
                box-shadow: 0 4px 20px rgba(0,0,0,.08); width: 320px; }
        h2 { margin: 0 0 20px; }
        input { width: 100%; padding: 10px; margin-bottom: 12px;
                border: 1px solid #ccd; border-radius: 6px; box-sizing: border-box; }
        button { width: 100%; padding: 10px; background: #2563eb; color: #fff;
                 border: none; border-radius: 6px; cursor: pointer; font-size: 15px; }
        button:hover { background: #1d4ed8; }
        .msg { margin-top: 12px; font-size: 14px; min-height: 18px; }
        .ok { color: #16a34a; }
        .err { color: #dc2626; }
        .tabs { display: flex; gap: 8px; margin-bottom: 16px; }
        .tabs button { background: #e5e7eb; color: #111; }
        .tabs button.active { background: #2563eb; color: #fff; }
    </style>
</head>
<body>
<div class="card">
    <div class="tabs">
        <button id="tabLogin" class="active" onclick="switchTab('login')">Вход</button>
        <button id="tabReg" onclick="switchTab('register')">Регистрация</button>
    </div>
    <h2 id="title">Вход</h2>
    <input id="username" placeholder="Логин" autocomplete="username">
    <input id="password" type="password" placeholder="Пароль" autocomplete="current-password">
    <button id="submitBtn" onclick="submitForm()">Войти</button>
    <div class="msg" id="msg"></div>
</div>

<script>
    let mode = 'login';

    function switchTab(m) {
        mode = m;
        document.getElementById('tabLogin').classList.toggle('active', m === 'login');
        document.getElementById('tabReg').classList.toggle('active', m === 'register');
        document.getElementById('title').textContent = m === 'login' ? 'Вход' : 'Регистрация';
        document.getElementById('submitBtn').textContent = m === 'login' ? 'Войти' : 'Зарегистрироваться';
        document.getElementById('msg').textContent = '';
    }

    async function submitForm() {
        const username = document.getElementById('username').value.trim();
        const password = document.getElementById('password').value;
        const msg = document.getElementById('msg');
        msg.className = 'msg';
        msg.textContent = '';

        if (!username || !password) {
            msg.classList.add('err');
            msg.textContent = 'Заполните оба поля';
            return;
        }

        const url = '/auth/' + (mode === 'login' ? 'login' : 'register');
        try {
            const res = await fetch(url, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username, password })
            });
            const data = await res.json();
            if (res.ok) {
                msg.classList.add('ok');
                msg.textContent = mode === 'login' ? 'Успешный вход!' : 'Пользователь создан!';
            } else {
                msg.classList.add('err');
                msg.textContent = data.error || 'Ошибка';
            }
        } catch (e) {
            msg.classList.add('err');
            msg.textContent = 'Сервер недоступен';
        }
    }
</script>
</body>
</html>
